<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects Showcase</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: #f8f9fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .showcase-container {
            width: 100%;
            max-width: 1200px;
            overflow: hidden;
            padding: 20px 0;
            position: relative;
        }
        
        .showcase-track {
            display: flex;
            animation: scroll 30s linear infinite;
            padding: 10px 0;
        }
        
        .showcase-track.paused {
            animation-play-state: paused;
        }
        
        .project-card {
            flex: 0 0 auto;
            width: 280px;
            height: 180px;
            margin: 0 15px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            background: #fff;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            position: relative;
        }
        
        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        
        .project-image {
            height: 110px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f3f5;
        }
        
        .project-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .project-image i {
            font-size: 2.5rem;
            color: #495057;
        }
        
        .project-content {
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #fff;
        }
        
        .project-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #212529;
        }
        
        .project-url {
            font-size: 0.8rem;
            color: #6c757d;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        @keyframes scroll {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(calc(-280px * 8));
            }
        }
        
        @media (max-width: 768px) {
            .project-card {
                width: 240px;
                height: 160px;
                margin: 0 10px;
            }
            
            @keyframes scroll {
                0% {
                    transform: translateX(0);
                }
                100% {
                    transform: translateX(calc(-240px * 8));
                }
            }
        }
    </style>
</head>
<body>
    <div class="showcase-container">
        <div class="showcase-track">
            <!-- Project cards will be added here by JavaScript -->
        </div>
    </div>

    <script>
        // Replace with your actual projects data
        const projects = [
            {
                title: "E-Commerce Store",
                url: "https://example-ecommerce.com",
                image: "https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=600&h=400&q=80",
                icon: "fa-shopping-cart"
            },
            {
                title: "Travel Blog",
                url: "https://example-travel.com",
                image: "https://images.unsplash.com/photo-1469474968028-56623f02e42e?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=600&h=400&q=80",
                icon: "fa-plane"
            },
            {
                title: "Tech News Portal",
                url: "https://example-tech.com",
                image: "https://images.unsplash.com/photo-1485827404703-89b55fcc595e?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=600&h=400&q=80",
                icon: "fa-newspaper"
            },
            {
                title: "Recipe Website",
                url: "https://example-recipes.com",
                image: "https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=600&h=400&q=80",
                icon: "fa-utensils"
            },
            {
                title: "Fitness App",
                url: "https://example-fitness.com",
                image: "https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=600&h=400&q=80",
                icon: "fa-dumbbell"
            },
            {
                title: "Photography Portfolio",
                url: "https://example-photos.com",
                image: "https://images.unsplash.com/photo-1542038784456-1ea8e935640e?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=600&h=400&q=80",
                icon: "fa-camera"
            },
            {
                title: "Educational Platform",
                url: "https://example-learning.com",
                image: "https://images.unsplash.com/photo-1501504905252-473c47e087f8?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=600&h=400&q=80",
                icon: "fa-graduation-cap"
            },
            {
                title: "Music Streaming",
                url: "https://example-music.com",
                image: "https://images.unsplash.com/photo-1511379938547-c1f69419868d?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=600&h=400&q=80",
                icon: "fa-music"
            }
        ];

        const showcaseTrack = document.querySelector('.showcase-track');
        let isPausedByUser = false;
        
        // Function to generate project cards
        function generateProjectCards() {
            // Clear existing content
            showcaseTrack.innerHTML = '';
            
            // Create cards for each project
            projects.forEach(project => {
                const card = document.createElement('div');
                card.className = 'project-card';
                
                // Use image if available, otherwise use icon
                const imageContent = project.image 
                    ? `<img src="${project.image}" alt="${project.title}">`
                    : `<i class="fas ${project.icon}"></i>`;
                
                card.innerHTML = `
                    <div class="project-image">
                        ${imageContent}
                    </div>
                    <div class="project-content">
                        <div class="project-title">${project.title}</div>
                        <div class="project-url">${project.url}</div>
                    </div>
                `;
                
                // Add click event to open project
                card.addEventListener('click', (e) => {
                    e.stopPropagation();
                    window.open(project.url, '_blank');
                });
                
                // Pause on hover
                card.addEventListener('mouseenter', () => {
                    showcaseTrack.classList.add('paused');
                });
                
                // Resume when not hovering
                card.addEventListener('mouseleave', () => {
                    if (!isPausedByUser) {
                        showcaseTrack.classList.remove('paused');
                    }
                });
                
                showcaseTrack.appendChild(card);
            });
            
            // Duplicate the cards for infinite scroll effect
            const cloneCards = showcaseTrack.innerHTML;
            showcaseTrack.innerHTML += cloneCards;
        }
        
        // Initialize the showcase
        generateProjectCards();
        
        // Resume scrolling when clicking anywhere outside the cards
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.project-card')) {
                isPausedByUser = false;
                showcaseTrack.classList.remove('paused');
            }
        });
        
        // Pause on drag
        let isDown = false;
        let startX;
        let scrollLeft;
        
        showcaseTrack.addEventListener('mousedown', (e) => {
            isDown = true;
            startX = e.pageX - showcaseTrack.offsetLeft;
            scrollLeft = showcaseTrack.scrollLeft;
            showcaseTrack.classList.add('paused');
            isPausedByUser = true;
            showcaseTrack.style.cursor = 'grabbing';
        });
        
        showcaseTrack.addEventListener('mouseleave', () => {
            isDown = false;
            showcaseTrack.style.cursor = 'grab';
        });
        
        showcaseTrack.addEventListener('mouseup', () => {
            isDown = false;
            showcaseTrack.style.cursor = 'grab';
        });
        
        showcaseTrack.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const x = e.pageX - showcaseTrack.offsetLeft;
            const walk = (x - startX) * 2;
            showcaseTrack.scrollLeft = scrollLeft - walk;
        });
        
        // Touch events for mobile
        showcaseTrack.addEventListener('touchstart', (e) => {
            isDown = true;
            startX = e.touches[0].pageX - showcaseTrack.offsetLeft;
            scrollLeft = showcaseTrack.scrollLeft;
            showcaseTrack.classList.add('paused');
            isPausedByUser = true;
        }, { passive: true });
        
        showcaseTrack.addEventListener('touchend', () => {
            isDown = false;
        });
        
        showcaseTrack.addEventListener('touchmove', (e) => {
            if (!isDown) return;
            const x = e.touches[0].pageX - showcaseTrack.offsetLeft;
            const walk = (x - startX) * 2;
            showcaseTrack.scrollLeft = scrollLeft - walk;
        }, { passive: true });
    </script>
</body>
</html>
