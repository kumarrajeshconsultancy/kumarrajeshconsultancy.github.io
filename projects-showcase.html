<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects Showcase</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: #f8f9fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .showcase-container {
            width: 100%;
            max-width: 1200px;
            overflow: hidden;
            padding: 20px 0;
            position: relative;
        }
        
        .showcase-track {
            display: flex;
            animation: scroll 30s linear infinite;
            padding: 10px 0;
        }
        
        .showcase-track.paused {
            animation-play-state: paused;
        }
        
        .project-card {
            flex: 0 0 auto;
            width: 280px;
            height: 200px;
            margin: 0 15px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            background: #fff;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            position: relative;
        }
        
        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        
        .project-image {
            height: 130px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f3f5;
            position: relative;
        }
        
        .project-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .project-image i {
            font-size: 2.5rem;
            color: #495057;
        }
        
        .project-content {
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #fff;
        }
        
        .project-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #212529;
        }
        
        .project-url {
            font-size: 0.8rem;
            color: #6c757d;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #3498db;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes scroll {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(calc(-280px * 8));
            }
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .project-card {
                width: 240px;
                height: 180px;
                margin: 0 10px;
            }
            
            .project-image {
                height: 110px;
            }
            
            @keyframes scroll {
                0% {
                    transform: translateX(0);
                }
                100% {
                    transform: translateX(calc(-240px * 8));
                }
            }
        }
    </style>
</head>
<body>
    <div class="showcase-container">
        <div class="showcase-track">
            <!-- Project cards will be added here by JavaScript -->
        </div>
    </div>

    <script>
        // Your website URLs
        const websites = [
            "https://kumarbrotherscompany.github.io",
            "https://yjssngo.github.io",
            "https://iiitchamp.github.io",
            "https://championrajeshkumar.github.io",
            "https://kumarbrotherscompany.github.io"
        ];

        const showcaseTrack = document.querySelector('.showcase-track');
        let isPausedByUser = false;
        
        // Function to generate thumbnail URL using a screenshot API
        function generateThumbnailUrl(url) {
            // Using a free screenshot API (note: these may have limitations)
            return `https://api.screenshotmachine.com?key=5d6f2f&url=${encodeURIComponent(url)}&dimension=600x400`;
            
            // Alternative: using a proxy to avoid CORS issues
            // return `https://images.weserv.nl/?url=${encodeURIComponent(url.replace(/^https?:\/\//, ''))}&w=600&h=400&t=square`;
        }
        
        // Function to generate project cards
        function generateProjectCards() {
            // Clear existing content
            showcaseTrack.innerHTML = '';
            
            // Create cards for each website
            websites.forEach(website => {
                const card = document.createElement('div');
                card.className = 'project-card';
                
                // Extract domain name for title
                const domain = website.replace(/^https?:\/\/(www\.)?/, '').replace(/\..*/, '');
                const title = domain.charAt(0).toUpperCase() + domain.slice(1);
                
                card.innerHTML = `
                    <div class="project-image">
                        <div class="loading-spinner"></div>
                    </div>
                    <div class="project-content">
                        <div class="project-title">${title}</div>
                        <div class="project-url">${website}</div>
                    </div>
                `;
                
                // Add click event to open website
                card.addEventListener('click', (e) => {
                    e.stopPropagation();
                    window.open(website, '_blank');
                });
                
                // Pause on hover
                card.addEventListener('mouseenter', () => {
                    showcaseTrack.classList.add('paused');
                });
                
                // Resume when not hovering
                card.addEventListener('mouseleave', () => {
                    if (!isPausedByUser) {
                        showcaseTrack.classList.remove('paused');
                    }
                });
                
                showcaseTrack.appendChild(card);
                
                // Load thumbnail after a short delay to allow rendering
                setTimeout(() => loadThumbnail(card, website), 100);
            });
            
            // Duplicate the cards for infinite scroll effect
            setTimeout(() => {
                const cloneCards = showcaseTrack.innerHTML;
                showcaseTrack.innerHTML += cloneCards;
                
                // Add events to cloned cards
                document.querySelectorAll('.project-card').forEach((card, index) => {
                    if (index >= websites.length) {
                        const originalIndex = index % websites.length;
                        const website = websites[originalIndex];
                        
                        card.addEventListener('click', (e) => {
                            e.stopPropagation();
                            window.open(website, '_blank');
                        });
                        
                        card.addEventListener('mouseenter', () => {
                            showcaseTrack.classList.add('paused');
                        });
                        
                        card.addEventListener('mouseleave', () => {
                            if (!isPausedByUser) {
                                showcaseTrack.classList.remove('paused');
                            }
                        });
                    }
                });
            }, 500);
        }
        
        // Function to load thumbnail
        function loadThumbnail(card, url) {
            const imageContainer = card.querySelector('.project-image');
            const spinner = card.querySelector('.loading-spinner');
            
            const img = new Image();
            img.onload = function() {
                if (spinner) spinner.style.display = 'none';
                imageContainer.innerHTML = '';
                imageContainer.appendChild(img);
            };
            img.onerror = function() {
                // If thumbnail fails to load, use a placeholder icon
                if (spinner) spinner.style.display = 'none';
                imageContainer.innerHTML = `<i class="fas fa-globe"></i>`;
            };
            img.src = generateThumbnailUrl(url);
            img.alt = url;
        }
        
        // Initialize the showcase
        generateProjectCards();
        
        // Resume scrolling when clicking anywhere outside the cards
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.project-card')) {
                isPausedByUser = false;
                showcaseTrack.classList.remove('paused');
            }
        });
        
        // Pause on drag
        let isDown = false;
        let startX;
        let scrollLeft;
        
        showcaseTrack.addEventListener('mousedown', (e) => {
            isDown = true;
            startX = e.pageX - showcaseTrack.offsetLeft;
            scrollLeft = showcaseTrack.scrollLeft;
            showcaseTrack.classList.add('paused');
            isPausedByUser = true;
            showcaseTrack.style.cursor = 'grabbing';
        });
        
        showcaseTrack.addEventListener('mouseleave', () => {
            isDown = false;
            showcaseTrack.style.cursor = 'grab';
        });
        
        showcaseTrack.addEventListener('mouseup', () => {
            isDown = false;
            showcaseTrack.style.cursor = 'grab';
        });
        
        showcaseTrack.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const x = e.pageX - showcaseTrack.offsetLeft;
            const walk = (x - startX) * 2;
            showcaseTrack.scrollLeft = scrollLeft - walk;
        });
        
        // Touch events for mobile
        showcaseTrack.addEventListener('touchstart', (e) => {
            isDown = true;
            startX = e.touches[0].pageX - showcaseTrack.offsetLeft;
            scrollLeft = showcaseTrack.scrollLeft;
            showcaseTrack.classList.add('paused');
            isPausedByUser = true;
        }, { passive: true });
        
        showcaseTrack.addEventListener('touchend', () => {
            isDown = false;
        });
        
        showcaseTrack.addEventListener('touchmove', (e) => {
            if (!isDown) return;
            const x = e.touches[0].pageX - showcaseTrack.offsetLeft;
            const walk = (x - startX) * 2;
            showcaseTrack.scrollLeft = scrollLeft - walk;
        }, { passive: true });
    </script>
</body>
</html>
